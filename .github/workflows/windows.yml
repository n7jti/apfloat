name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Unit and functional tests
        run: ctest --test-dir build -C Release -L "unit|functional" --output-on-failure
      - name: Benchmarks
        run: ctest --test-dir build -C Release -L performance --output-on-failure
      - name: Install static library
        run: cmake --install build --config Release --prefix package
      - name: Configure external consumer
        run: cmake -S tests/consumer -B build/consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/package"
      - name: Build external consumer
        run: cmake --build build/consumer --config Release
      - name: Run external consumer
        run: .\build\consumer\Release\consumer.exe
      - uses: actions/upload-artifact@v6
        with:
          name: apfloat-windows
          path: |
            package
            build/benchmark.csv
          if-no-files-found: error
